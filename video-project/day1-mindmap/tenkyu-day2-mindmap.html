    if (n.u) { // リンクつきの箱は、タップで別のタブに開く
      const a = document.createElementNS(NS, 'a');
      a.setAttribute('href', n.u); a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener');
      g.setAttribute('class', g.getAttribute('class') + ' link-node');
      a.append(g); nodes.append(a);
    } else nodes.append(g);
  })(DATA);
}

// タップ・クリックは地図全体で一度だけ受け取る（描き直しても確実に反応する）
const NODES = [];
function toggleNode(n) {
  if (n.depth === 0) { DATA.c.forEach(b => { b.open = true; }); render(); return; } // 中心をタップしたら枝をすべて見せる
  n.open = !n.open; if (!n.open) closeAll(n, false); render();
}
function nodeFrom(e) { const g = e.target.closest && e.target.closest('.node'); return g && g.dataset.id ? NODES[+g.dataset.id] : null; }
svg.addEventListener('click', e => { const n = nodeFrom(e); if (n) toggleNode(n); });
svg.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const n = nodeFrom(e); if (n) { e.preventDefault(); toggleNode(n); } });

function closeAll(n, self = true) { if (self) n.open = false; (n.c || []).forEach(k => closeAll(k)); }
function openAll(n) { n.open = true; (n.c || []).forEach(openAll); }

// 話す順に、次の枝を開く（前の枝は閉じて、いま話している枝に集中する）
let step = -1;
document.getElementById('btn-next').addEventListener('click', () => {
  step = (step + 1) % DATA.c.length;
  DATA.c.forEach((b, i) => { if (i === step) openAll(b); else closeAll(b); });
  render();
  const b = DATA.c[step];
  const stage = document.getElementById('stage');
  let top = b.y - b.b.h / 2;
  (function minY(n) { top = Math.min(top, n.y - n.b.h / 2); if (n.open) (n.c || []).forEach(minY); })(b);
  stage.scrollTo({ top: Math.max(0, top), left: 0, behavior: 'smooth' });
});
document.getElementById('btn-all').addEventListener('click', () => { openAll(DATA); render(); });
document.getElementById('btn-reset').addEventListener('click', () => { step = -1; DATA.c.forEach(b => closeAll(b)); render(); document.getElementById('stage').scrollTo({ top: 0, left: 0 }); });

const mq = window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener?.('change', () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => render());
render();
</script>

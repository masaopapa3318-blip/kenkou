const COLORS = ['--b10', '--b9', '--b2', '--b1', '--b3', '--b4', '--b5', '--b6', '--b7', '--b8', '--b11', '--b12'];
const FONT = [22, 18, 14.5, 13.5];
const LINE_H = [30, 25, 21, 19];
const PAD_X = [18, 16, 12, 10];
const PAD_Y = [14, 10, 8, 6];
const GAP_X = [56, 52, 44];
const GAP_Y = [14, 10, 8];

// 開閉状態を付ける（最初は幹だけ見せる）
(function init(n, d, color) {
  n.depth = d; n.color = color; n.open = d === 0;
  (n.c || []).forEach((k, i) => init(k, d + 1, d === 0 ? COLORS[i % COLORS.length] : color));
})(DATA, 0, '--root');

const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const measureCtx = document.createElement('canvas').getContext('2d');

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function textW(s, fs, bold) {
  measureCtx.font = `${bold ? 700 : 400} ${fs}px "Noto Sans JP", sans-serif`;
  return measureCtx.measureText(s).width;
}
function boxSize(n) {
  const d = Math.min(n.depth, 3);
  const lines = n.t.split('\n');
  if (n.k === 'q') lines[0] = 'Q. ' + lines[0];
  if (n.s) lines.push(n.s);
  const w = Math.max(...lines.map(l => textW(l, FONT[d], d < 2 || n.k === 'key'))) + PAD_X[d] * 2 + (n.c ? 18 : 0);
  return { w: Math.ceil(w), h: lines.length * LINE_H[d] + PAD_Y[d] * 2, lines };
}

function layout() {
  const colX = [0];
  // 深さごとの最大幅で列を決める
  const maxW = [];
  (function walk(n) { const b = boxSize(n); n.b = b; maxW[n.depth] = Math.max(maxW[n.depth] || 0, b.w);
    if (n.open) (n.c || []).forEach(walk); })(DATA);
  for (let d = 1; d < maxW.length; d++) colX[d] = colX[d - 1] + maxW[d - 1] + GAP_X[Math.min(d - 1, GAP_X.length - 1)];
  let y = 0;
  (function place(n) {
    const kids = n.open ? (n.c || []) : [];
    n.x = colX[n.depth];
    if (!kids.length) { n.y = y + n.b.h / 2; y += n.b.h + GAP_Y[Math.max(0, Math.min(n.depth - 1, 2))]; return; }
    const top = y;
    kids.forEach(place);
    const first = kids[0].y, last = kids[kids.length - 1].y;
    n.y = (first + last) / 2;
    if (y - top < n.b.h) y = top + n.b.h + GAP_Y[0];
  })(DATA);
  const last = maxW.length - 1;
  return { w: colX[last] + maxW[last] + 40, h: y };
}

function render(fade) {
  const size = layout();
  const M = 24;
  const W = Math.max(size.w + M * 2, 320), H = Math.max(size.h + M * 2, 320);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `${-M} ${-M} ${W} ${H}`);
  svg.replaceChildren();
  NODES.length = 0;
  const links = document.createElementNS(NS, 'g'), nodes = document.createElementNS(NS, 'g');
  svg.append(links, nodes);
  (function draw(n) {
    const kids = n.open ? (n.c || []) : [];
    kids.forEach(k => {
      const p = document.createElementNS(NS, 'path');
      const x1 = n.x + n.b.w, y1 = n.y, x2 = k.x, y2 = k.y, mx = (x1 + x2) / 2;
      p.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      p.setAttribute('class', 'link');
      p.setAttribute('stroke', cssVar(k.color));
      links.append(p);
      draw(k);
    });
    const g = document.createElementNS(NS, 'g');
    const d = Math.min(n.depth, 3);
    g.setAttribute('class', `node d${d}`);
    g.setAttribute('transform', `translate(${n.x},${n.y - n.b.h / 2})`);
    g.setAttribute('tabindex', n.c ? '0' : '-1');
    if (n.c) g.setAttribute('role', 'button');
    let r = document.createElementNS(NS, 'rect');
    r.setAttribute('width', n.b.w); r.setAttribute('height', n.b.h);
    r.setAttribute('rx', d === 0 ? 18 : d === 1 ? 14 : 10);
    const col = cssVar(n.color);
    if (d === 0) { r.setAttribute('fill', col); r.setAttribute('stroke', col); }
    else if (d === 1) { r.setAttribute('fill', cssVar('--surface')); r.setAttribute('stroke', col); r.setAttribute('stroke-width', '2.5'); }
    else if (n.k === 'key') { r.setAttribute('fill', cssVar('--surface')); r.setAttribute('stroke', col); r.setAttribute('stroke-width', '2');
      const tint = document.createElementNS(NS, 'rect'); tint.setAttribute('width', n.b.w); tint.setAttribute('height', n.b.h); tint.setAttribute('rx', 10);
      tint.setAttribute('fill', col); tint.setAttribute('fill-opacity', '.13'); tint.setAttribute('pointer-events', 'none'); g.append(r); r = tint; }
    else if (n.k === 'q') { r.setAttribute('fill', cssVar('--surface')); r.setAttribute('stroke', col); r.setAttribute('stroke-dasharray', '5 4'); }
    else { r.setAttribute('fill', cssVar('--surface')); r.setAttribute('stroke', col); r.setAttribute('stroke-opacity', '.45'); }
    g.append(r);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('font-size', FONT[d]);
    if (n.k === 'key') t.setAttribute('font-weight', '700');
    n.b.lines.forEach((line, i) => {
      const ts = document.createElementNS(NS, 'tspan');
      ts.setAttribute('x', PAD_X[d]);
      ts.setAttribute('y', PAD_Y[d] + LINE_H[d] * (i + 0.72));
      ts.textContent = line;
      if (n.s && i === n.b.lines.length - 1) { ts.setAttribute('font-size', FONT[d] * 0.72); ts.setAttribute('fill', cssVar('--muted')); }
      if (d === 1 && i === 0) ts.setAttribute('fill', col);
      t.append(ts);
    });
    g.append(t);
    if (n.c && d > 0) {
      const ch = document.createElementNS(NS, 'text');
      ch.setAttribute('class', 'chev');
      ch.setAttribute('x', n.b.w - 16); ch.setAttribute('y', n.b.h / 2 + 5);
      ch.setAttribute('fill', col);
      ch.textContent = n.open ? '−' : '＋';
      g.append(ch);
    }
    if (n.c) {
      g.dataset.id = NODES.push(n) - 1;
    }
    if (n.u) { // リンクつきの箱は、タップで別のタブに開く
      const a = document.createElementNS(NS, 'a');
      a.setAttribute('href', n.u); a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener');
      g.setAttribute('class', g.getAttribute('class') + ' link-node');
      a.append(g); nodes.append(a);
    } else nodes.append(g);
  })(DATA);
}

// タップ・クリックは地図全体で一度だけ受け取る（描き直しても確実に反応する）
const NODES = [];
function toggleNode(n) {
  if (n.depth === 0) { DATA.c.forEach(b => { b.open = true; }); render(); return; } // 中心をタップしたら枝をすべて見せる
  n.open = !n.open; if (!n.open) closeAll(n, false); render();
}
function nodeFrom(e) { const g = e.target.closest && e.target.closest('.node'); return g && g.dataset.id ? NODES[+g.dataset.id] : null; }
svg.addEventListener('click', e => { const n = nodeFrom(e); if (n) toggleNode(n); });
svg.addEventListener('keydown', e => { if (e.key !== 'Enter' && e.key !== ' ') return; const n = nodeFrom(e); if (n) { e.preventDefault(); toggleNode(n); } });

function closeAll(n, self = true) { if (self) n.open = false; (n.c || []).forEach(k => closeAll(k)); }
function openAll(n) { n.open = true; (n.c || []).forEach(openAll); }

// 話す順に、次の枝を開く（前の枝は閉じて、いま話している枝に集中する）
let step = -1;
document.getElementById('btn-next').addEventListener('click', () => {
  step = (step + 1) % DATA.c.length;
  DATA.c.forEach((b, i) => { if (i === step) openAll(b); else closeAll(b); });
  render();
  const b = DATA.c[step];
  const stage = document.getElementById('stage');
  let top = b.y - b.b.h / 2;
  (function minY(n) { top = Math.min(top, n.y - n.b.h / 2); if (n.open) (n.c || []).forEach(minY); })(b);
  stage.scrollTo({ top: Math.max(0, top), left: 0, behavior: 'smooth' });
});
document.getElementById('btn-all').addEventListener('click', () => { openAll(DATA); render(); });
document.getElementById('btn-reset').addEventListener('click', () => { step = -1; DATA.c.forEach(b => closeAll(b)); render(); document.getElementById('stage').scrollTo({ top: 0, left: 0 }); });

const mq = window.matchMedia('(prefers-color-scheme: dark)');
mq.addEventListener?.('change', () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => render());
render();
</script>
